<!-- @dsCard group="4 · Mobile" height=880 width=430 subtitle="Same paper overlay, rows at heading-lg with inline numerals" -->
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;800&family=Archivo:wght@400;500&family=Space+Mono:wght@400;700&display=swap">
<style>
  :root{
    --t-paper-100: var(--paper-100,#f2efe9); --t-paper-200: var(--paper-200,#e7e2d8);
    --t-hair-l: var(--hairline-light,#cfc8b9);
    --t-ink-900: var(--ink-900,#14121c); --t-ink-600: var(--ink-600,#5f5a4e);
    --t-purple-600: var(--purple-600,#9a8bc7);
    --t-purple-ink: var(--purple-ink,#4a3c78);
    --f-display: var(--font-display, Figtree, sans-serif);
    --f-edit: var(--font-editorial, Archivo, sans-serif);
    --f-meta: var(--font-meta, "Space Mono", monospace);
  }
  *{box-sizing:border-box;margin:0}
  body{background:#000;font-family:var(--f-edit)}
  .stage{width:430px;height:880px;background:var(--t-paper-100);padding:26px 18px 22px;
         display:flex;flex-direction:column}
  .top{display:flex;align-items:center;justify-content:space-between;height:44px;flex:none}
  .mark{font-family:var(--f-display);font-weight:800;font-size:18px;letter-spacing:-.02em;color:var(--t-ink-900)}
  .mark i{color:var(--t-purple-ink);font-style:normal}
  .close{display:inline-flex;align-items:center;gap:8px;height:44px;padding:0 16px;border-radius:999px;
         border:1px solid var(--t-ink-900);color:var(--t-ink-900);
         font-family:var(--f-meta);font-size:12px;font-weight:700;letter-spacing:.1em}

  .rows{flex:1;display:flex;flex-direction:column;justify-content:center;gap:0}
  .row{display:flex;align-items:baseline;gap:14px;padding:18px 8px;border-top:1px solid var(--t-hair-l);
       text-decoration:none;min-height:64px}
  .row:last-of-type{border-bottom:1px solid var(--t-hair-l)}
  .row .n{font-family:var(--f-meta);font-size:11px;letter-spacing:.16em;color:var(--t-ink-600)}
  .row .label{font-family:var(--f-edit);font-weight:400;font-size:34px;line-height:1.12;
       letter-spacing:-.02em;color:var(--t-ink-900)}
  .row.hover{background:var(--t-paper-200)}
  .row.hover .n{color:var(--t-purple-ink)}

  .foot{flex:none;display:flex;flex-direction:column;gap:12px;padding-top:20px}
  .foot a{font-size:14px;color:var(--t-ink-600);text-decoration:none}
  .socials{display:flex;gap:20px}
  .frow{display:flex;align-items:center;justify-content:space-between}
  .clock{font-family:var(--f-meta);font-size:10px;letter-spacing:.14em;color:var(--t-ink-600)}
  .stampmini{font-family:var(--f-display);font-weight:800;font-size:16px;color:var(--t-ink-900);letter-spacing:-.02em}
  .stampmini i{color:var(--t-purple-ink);font-style:normal}
</style>

<div class="stage">
  <div class="top">
    <div class="mark">twelve<i>.</i></div>
    <span class="close">CLOSE ✕</span>
  </div>

  <nav class="rows">
    <a class="row" href="#"><span class="n">01</span><span class="label">Home</span></a>
    <a class="row hover" href="#"><span class="n">02</span><span class="label">Work</span></a>
    <a class="row" href="#"><span class="n">03</span><span class="label">About</span></a>
    <a class="row" href="#"><span class="n">04</span><span class="label">Playground</span></a>
    <a class="row" href="#"><span class="n">05</span><span class="label">Contact</span></a>
  </nav>

  <div class="foot">
    <a href="#">contact@bytw12ve.com</a>
    <div class="socials"><a href="#">Instagram</a><a href="#">GitHub</a></div>
    <div class="frow"><span class="clock">OMAHA 1:30:02 PM</span><span class="stampmini">12<i>.</i></span></div>
  </div>
</div>

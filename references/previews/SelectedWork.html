<!-- @dsCard group="3 · Sections" height=1120 width=1440 subtitle="Editorial rows, alternating spread; row 01 shown hovered" -->
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;800&family=Archivo:wght@400;500&family=Space+Mono:wght@400;700&display=swap">
<style>
  :root{
    --t-void-900: var(--void-900,#07060a); --t-void-700: var(--void-700,#15131c);
    --t-void-600: var(--void-600,#1f1c29); --t-hair: var(--hairline-dark,#2f2b3b);
    --t-star-100: var(--star-100,#edeaf5); --t-star-400: var(--star-400,#9b96ae);
    --t-purple-600: var(--purple-600,#9a8bc7); --t-purple-400: var(--purple-400,#cbc0eb);
    --t-purple-500: var(--purple-500,#b5a9db);
    --t-sky-300: var(--sky-300,#7fb6ee); --t-grass-400: var(--grass-400,#6f9d4e);
    --t-bloom-300: var(--bloom-300,#e9a6c6); --t-bloom-500: var(--bloom-500,#e0b431);
    --f-display: var(--font-display, Figtree, sans-serif);
    --f-edit: var(--font-editorial, Archivo, sans-serif);
    --f-meta: var(--font-meta, "Space Mono", monospace);
  }
  *{box-sizing:border-box;margin:0}
  body{background:var(--t-void-900);font-family:var(--f-edit);color:var(--t-star-100)}
  .stage{width:1440px;height:1120px;padding:72px 64px 40px;position:relative}

  .opener{display:flex;align-items:baseline;justify-content:space-between;
          border-top:1px solid var(--t-hair);padding-top:18px;margin-bottom:56px}
  .eyebrow{font-family:var(--f-meta);font-size:12px;letter-spacing:.14em;color:var(--t-star-400)}
  .eyebrow b{color:var(--t-star-100);font-weight:400}

  .row{display:grid;grid-template-columns:64px 1fr 420px;gap:40px;align-items:center;
       padding:28px 0;border-bottom:1px solid var(--t-hair);text-decoration:none;color:inherit}
  .row.flip{grid-template-columns:420px 64px 1fr}
  .row.flip .well{order:1} .row.flip .idx{order:2} .row.flip .txt{order:3}
  .idx{font-family:var(--f-meta);font-size:12px;letter-spacing:.14em;color:var(--t-star-400);align-self:start;padding-top:10px}
  .title{font-family:var(--f-edit);font-weight:500;font-size:56px;line-height:1.02;letter-spacing:-.025em}
  .meta{display:flex;gap:18px;align-items:center;margin-top:14px;
        font-family:var(--f-meta);font-size:11px;letter-spacing:.14em;color:var(--t-star-400)}
  .kind{border:1px solid var(--t-hair);border-radius:999px;padding:5px 12px;color:var(--t-star-100)}
  .arrow{display:inline-flex;align-items:center;gap:8px;margin-top:20px;
        font-family:var(--f-meta);font-size:12px;letter-spacing:.14em;color:var(--t-star-100)}
  .arrow em{font-style:normal;color:var(--t-purple-500)}
  .well{height:232px;border-radius:var(--radius-md,18px);background:var(--t-void-700);
        border:1px solid var(--t-hair);overflow:hidden;position:relative}
  .row.dim{opacity:.62}
  .row.hov .well{border-color:var(--t-purple-500)}

  .w1{background:linear-gradient(180deg,#10121c,#171427)}
  .w1:after{content:"";position:absolute;left:50%;top:50%;width:120px;height:120px;border-radius:50%;
        transform:translate(-50%,-50%);background:var(--t-purple-500)}
  .w2{background:#0e0d15}
  .w3{background:#121019}
  .w3 svg{position:absolute;inset:0;width:100%;height:100%}
  .bars{position:absolute;left:32px;right:32px;bottom:34px;display:flex;gap:10px;align-items:flex-end;height:96px}
  .bars i{flex:1;background:var(--t-purple-400);border-radius:3px;opacity:.85}
  .pix{position:absolute;inset:0}
  .allwork{margin-top:44px;display:inline-flex;align-items:center;gap:10px;height:48px;padding:0 24px;
        border-radius:999px;border:1px solid var(--t-hair);color:var(--t-star-100);text-decoration:none;
        font-family:var(--f-meta);font-size:14px;font-weight:700;letter-spacing:.1em}
</style>

<div class="stage">
  <div class="opener">
    <div class="eyebrow">SELECTED WORK — <b>FOUR THINGS WE FINISHED</b></div>
    <div class="eyebrow">2024 → 2026</div>
  </div>

  <a class="row hov" href="#">
    <div class="idx">01</div>
    <div>
      <div class="title">The 402</div>
      <div class="meta"><span class="kind">iOS APP</span><span>SELF-DISCOVERY FOR OMAHA</span><span>2026</span></div>
      <div class="arrow">OPEN PROJECT <em>→</em></div>
    </div>
    <div class="well w1"></div>
  </a>

  <a class="row flip dim" href="#">
    <div class="well w2"><svg class="pix" id="p2" viewBox="0 0 420 232" preserveAspectRatio="none"></svg></div>
    <div class="idx">02</div>
    <div class="txt">
      <div class="title">Keeb.wiki</div>
      <div class="meta"><span class="kind">WEB PRODUCT</span><span>COMMUNITY BUILD ARCHIVE</span><span>2025</span></div>
      <div class="arrow">OPEN PROJECT <em>→</em></div>
    </div>
  </a>

  <a class="row dim" href="#">
    <div class="idx">03</div>
    <div>
      <div class="title">Mosh</div>
      <div class="meta"><span class="kind">CREATIVE TOOL</span><span>STUDIO WORKFLOW, INTERNAL</span><span>2025</span></div>
      <div class="arrow">OPEN PROJECT <em>→</em></div>
    </div>
    <div class="well w3"><svg viewBox="0 0 420 232" preserveAspectRatio="xMidYMid meet" aria-hidden="true">
      <rect x="104" y="46" width="212" height="140" rx="18" fill="none" stroke="var(--t-purple-500)" stroke-width="2"/>
      <rect x="132" y="66" width="156" height="100" rx="14" fill="none" stroke="var(--t-purple-400)" stroke-width="2" opacity=".75"/>
      <rect x="160" y="86" width="100" height="60" rx="10" fill="var(--t-purple-600)" opacity=".5"/>
      <circle cx="210" cy="116" r="12" fill="var(--t-purple-500)"/></svg></div>
  </a>

  <a class="allwork" href="#">ALL WORK →</a>
</div>

<script>
(function(){
  function rng(seed){var s=seed>>>0;return function(){s=(s*1664525+1013904223)>>>0;return s/4294967296;};}
  var r=rng(77),out=[],cols=9,rows=4,w=34,h=34,gx=6,gy=6,x,y;
  var ox=(420-(cols*w+(cols-1)*gx))/2, oy=(232-(rows*h+(rows-1)*gy))/2;
  for(y=0;y<rows;y++)for(x=0;x<cols;x++){
    var v=r(), f = v<0.10 ? 'var(--t-purple-500)' : (v<0.22 ? '#221f30' : '#1a1826');
    var st = v<0.10 ? 'var(--t-purple-400)' : '#2f2b3b';
    out.push('<rect x="'+(ox+x*(w+gx))+'" y="'+(oy+y*(h+gy))+'" width="'+w+'" height="'+h+'" rx="6" fill="'+f+'" stroke="'+st+'"/>');
  }
  document.getElementById('p2').innerHTML=out.join('');
})();
</script>
